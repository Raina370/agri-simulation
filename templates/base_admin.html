{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Administration - AgriSim{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <button type="button" class="burger-btn" id="burger-btn"><i class='bx bx-menu'></i></button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo"><i class='bx bxs-leaf'></i> AgriSim <span class="badge-admin">Admin</span></div>
            <nav class="sidebar-nav">
                <a href="{% url 'dashboard_admin' %}" class="sidebar-item {% if request.resolver_match.url_name == 'dashboard_admin' %}sidebar-item-actif{% endif %}">
                    <i class='bx bx-grid-alt'></i> <span>Vue d'ensemble</span>
                </a>
                <a href="{% url 'admin_utilisateurs' %}" class="sidebar-item {% if 'utilisateur' in request.resolver_match.url_name %}sidebar-item-actif{% endif %}">
                    <i class='bx bx-group'></i> <span>Utilisateurs</span>
                </a>
                <a href="{% url 'admin_cultures' %}" class="sidebar-item {% if 'culture' in request.resolver_match.url_name %}sidebar-item-actif{% endif %}">
                    <i class='bx bxs-leaf'></i> <span>Cultures</span>
                </a>
                <a href="{% url 'admin_sols' %}" class="sidebar-item {% if 'sol' in request.resolver_match.url_name %}sidebar-item-actif{% endif %}">
                    <i class='bx bx-layer'></i> <span>Sols</span>
                </a>
            </nav>
            <a href="{% url 'deconnexion' %}" class="sidebar-item sidebar-deconnexion">
                <i class='bx bx-log-out'></i> <span>Déconnexion</span>
            </a>
        </aside>
        <div class="app-contenu">
            {% if messages %}
                <div class="app-messages">
                    {% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}
                </div>
            {% endif %}
            
    <script src="{% static 'JS/base_admin.js' %}"></script>
            {% block content %}{% endblock %}
        </div>
    </div>

</body>
</html>
